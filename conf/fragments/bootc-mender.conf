BB_CONF_FRAGMENT_SUMMARY = "oeros on bootc with the Mender client (no A/B partitions)."
BB_CONF_FRAGMENT_DESCRIPTION = "Everything the oeros-bootc-host image and the \
ros-core app artifact need beyond the oeros distro and the bootc fragments: \
the Mender client without a partition layout, podman OCI container images, \
and a kernel panic timeout for the grub boot counter. The tenant token comes \
from the MENDER_TENANT_TOKEN environment variable (passed through by the \
setup). \
"

# oeros.conf reads these without defaults
OEROS_DEFAULT_DISTRO_FEATURES ?= ""
OEROS_DEFAULT_EXTRA_RDEPENDS ?= ""
OEROS_DEFAULT_EXTRA_RRECOMMENDS ?= ""

# oeros container images for podman, built with umoci
CONTAINER_PROFILE = "podman"
IMAGE_CONTAINER_NO_DUMMY = "1"
OCI_IMAGE_BACKEND = "umoci"
RPROVIDES:osrf-pycommon += "python3-osrf-pycommon"

# Mender client only: no mender-image* feature, no A/B layout. ostree and
# bootc own the OS; /var/lib/mender is shared by all deployments.
INHERIT += "mender-setup"
MENDER_FEATURES_ENABLE:append = " mender-auth-install mender-update-install mender-systemd"
MENDER_SERVER_URL ?= "https://hosted.mender.io"
MENDER_CONNECT_USER ?= "root"

# A kernel panic reboots, so the grub boot counter can fall back
BOOTC_KERNEL_ARGS:append = " panic=5"

# Reproducible OCI images: image-oci otherwise stamps the build time into the
# org.opencontainers.image.created label, so every rebuild of identical
# content gets a new manifest digest (bootc treats it as a new OS image).
OCI_IMAGE_BUILD_DATE ?= "none"
