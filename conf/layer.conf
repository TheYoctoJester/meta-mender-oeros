# meta-mender-oeros: oeros on bootc (meta-bootc) with Mender as the
# deployment, fleet management and remote access layer.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mender-oeros"
BBFILE_PATTERN_mender-oeros = "^${LAYERDIR}/"
BBFILE_PRIORITY_mender-oeros = "10"

LAYERSERIES_COMPAT_mender-oeros = "wrynose"
LAYERDEPENDS_mender-oeros = "core bootc mender oeros virtualization-layer"
