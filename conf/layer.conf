# meta-oeros-bootc-mender: oeros on bootc (meta-bootc) with Mender as the
# deployment, fleet management and remote access layer.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "oeros-bootc-mender"
BBFILE_PATTERN_oeros-bootc-mender = "^${LAYERDIR}/"
BBFILE_PRIORITY_oeros-bootc-mender = "10"

LAYERSERIES_COMPAT_oeros-bootc-mender = "wrynose"
LAYERDEPENDS_oeros-bootc-mender = "core bootc mender oeros virtualization-layer"
