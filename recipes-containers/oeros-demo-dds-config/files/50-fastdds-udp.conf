# Fast DDS uses shared memory between participants on the same host, but every
# podman container gets its own IPC namespace (/dev/shm), so ROS 2 nodes in
# different containers discover each other and then never receive data.
# Force UDPv4 for every container started on this host.
[containers]
env = ["FASTDDS_BUILTIN_TRANSPORTS=UDPv4"]
